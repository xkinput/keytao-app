[workspace]
resolver = "2"
members = [
  "crates/keytao-app-core",
  "crates/keytao-app-bridge",
  "crates/keytao-core",
  "crates/keytao-core-ffi",
  "crates/keytao-theme",
  "crates/keytao-schema-logo",
  "crates/keytao-linux-ime",
  "crates/keytao-windows-ime",
]

[workspace.package]
version = "1.2.5-alpha.5"
license = "MIT"

# Shared version pinning across all workspace members
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
dirs = "5"
tokio = { version = "1", features = ["full"] }

[patch.crates-io]
librime-sys = { path = "crates/librime-sys" }
