name: keytao
description: "KeyTao cross-platform input method and scheme manager."
publish_to: 'none'
version: 1.2.25-alpha.1+1002025

environment:
  sdk: ^3.13.4

dependencies:
  code_assets: ^1.2.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  forui: 0.27.2
  hooks: ^2.0.2
  webview_core:
    path: third_party/webview_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/licenses/
    - third_party/webview_core/NOTICE
    - third_party/webview_core/LICENSE
