name: webview_core
description: Zero-dependency native WebView plugin for Flutter across Android, iOS, Linux, macOS, Windows, and Web. Replaces webview_flutter and webview_all with Wasm support.
version: 1.1.0
homepage: https://github.com/infradise/webview_core
repository: https://github.com/infradise/webview_core
issue_tracker: https://github.com/infradise/webview_core/issues
topics:
  - webview
  - html
  - browser
  - wkwebview
  - webview2

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.infradise.webview_core
        pluginClass: WebviewCorePlugin
      ios:
        pluginClass: WebviewCorePlugin
      linux:
        pluginClass: WebviewCorePlugin
      macos:
        pluginClass: WebviewCorePlugin
      windows:
        pluginClass: WebviewCorePluginCApi
      web:
        pluginClass: WebviewCoreWeb
        fileName: webview_core_web.dart
