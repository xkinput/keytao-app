[build]
[profile.dev]
debug = 1

# Android 15+ devices can use 16 KB pages; 64-bit native libraries must be 16 KB aligned.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[profile.dev.package."*"]
# Compile dependencies with optimization even in dev mode
# This makes GTK/WebKit bindings much faster to run without full release build
opt-level = 3
debug = false
