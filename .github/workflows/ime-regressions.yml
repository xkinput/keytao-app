name: IME regressions

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/ime-regressions.yml'
      - 'scripts/librime-versions.env'
      - 'scripts/build-linux-librime.sh'
      - 'scripts/fetch-librime.sh'
      - 'scripts/fetch-librime-windows.ps1'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native IME test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev cmake ninja-build g++ pkg-config gdb \
            libboost-regex-dev libsnappy-dev libfreetype6-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev
      - name: Read runner image version
        id: image
        run: printf 'os=%s\nversion=%s\n' "${ImageOS:?}" "${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Cache Linux librime
        id: linux-librime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/keytao-librime
          key: linux-librime-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('scripts/build-linux-librime.sh', 'scripts/librime-versions.env') }}
      - name: Build pinned librime with merged Lua
        if: steps.linux-librime.outputs.cache-hit != 'true'
        run: bash scripts/build-linux-librime.sh "$RUNNER_TEMP/keytao-librime"
      - name: Configure Linux librime
        run: |
          prefix="$RUNNER_TEMP/keytao-librime"
          {
            echo "RIME_INCLUDE_DIR=$prefix/include"
            echo "RIME_LIB_DIR=$prefix/lib"
            echo "LD_LIBRARY_PATH=$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          } >> "$GITHUB_ENV"
      - name: Read Rust toolchain pin
        id: rust
        run: |
          sed -n 's/^channel = "\(.*\)"/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
          sed -n 's/^channel = "\(.*\)"/RUSTUP_TOOLCHAIN=\1/p' rust-toolchain.toml >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-ime-regressions
      - name: Test shared runtime, FFI and Linux backends
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --locked -p keytao-core -p keytao-core-ffi -p keytao-linux-ime -p keytao-ime-ipc -p keytao-app-core -- --test-threads=1 --nocapture > ime-regressions.log 2>&1
          result=$?
          cat ime-regressions.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          log = Path('ime-regressions.log')
          original = log.read_text(errors='replace')
          if 'Rust cannot catch foreign exceptions' in original:
              with log.open('a') as output:
                  subprocess.run(['pkg-config', '--modversion', 'rime'], stdout=output, stderr=subprocess.STDOUT)
                  subprocess.run(['dpkg-query', '-W', 'librime*'], stdout=output, stderr=subprocess.STDOUT)
                  binary = re.search(r'target/debug/deps/candidate_api-[0-9a-f]+', original)
                  if binary:
                      Path('ime-regression.gdb').write_text('set pagination off\nset print thread-events off\ncatch throw\ncommands\nsilent\nprintf "C++ exception\\n"\nbt 12\ncontinue\nend\nrun\nthread apply all bt 20\n')
                      try:
                          subprocess.run(['gdb', '-q', '-batch', '-x', 'ime-regression.gdb', '--args', binary[0], '--test-threads=1', '--nocapture'], stdout=output, stderr=subprocess.STDOUT, timeout=180)
                      except subprocess.TimeoutExpired:
                          output.write('\nNative crash diagnostic timed out.\n')
          detail = Path('ime-regressions.log').read_text(errors='replace')[-12000:]
          # GitHub truncates each annotation at 4096 characters. Emit the end
          # of the log first, in small blocks, so the actual error stays visible.
          for index, end in enumerate(range(len(detail), 0, -2500), 1):
              block = detail[max(0, end - 2500):end]
              block = block.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native IME failure detail {index}::{block}')
          PY
          fi
          exit "$result"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Rust toolchain pin
        id: rust
        shell: bash
        run: |
          sed -n 's/^channel = "\(.*\)"/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
          sed -n 's/^channel = "\(.*\)"/RUSTUP_TOOLCHAIN=\1/p' rust-toolchain.toml >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-ime-regressions
      - name: Install Windows system deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install 7zip llvm -y --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Windows dependency installation failed" }
          $llvmBin = "C:\Program Files\LLVM\bin"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cache Windows librime SDK
        uses: actions/cache@v4
        with:
          path: .cache/librime
          key: windows-librime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-librime-windows.ps1', 'scripts/librime-versions.env') }}
      - name: Fetch pinned Windows x64 librime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-librime-windows.ps1 -Arch x64
      - name: Test Windows IME
        shell: pwsh
        run: |
          . ./vendor/librime/windows-x64/env.ps1
          cargo test --locked -p keytao-windows-ime -p keytao-windows-ime-server -p keytao-ime-ipc -- --test-threads=1

  apple-policy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Read Rust toolchain pin
        id: rust
        run: |
          sed -n 's/^channel = "\(.*\)"/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
          sed -n 's/^channel = "\(.*\)"/RUSTUP_TOOLCHAIN=\1/p' rust-toolchain.toml >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple-policy-regressions
      - name: Cache macOS librime SDK
        uses: actions/cache@v4
        with:
          path: .cache/librime
          key: macos-librime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-librime.sh', 'scripts/librime-versions.env') }}
      - name: Fetch pinned macOS librime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-librime.sh --platform macos --destination "$GITHUB_WORKSPACE/vendor/librime/macos-universal"
      - name: Typecheck iOS keyboard with device SDK
        run: bash crates/keytao-ios-ime/check-swift-sdk.sh
      - name: Test macOS input context, theme fonts and chord keys
        run: |
          bash crates/keytao-macos-ime/test-input-context.sh
          bash crates/keytao-macos-ime/test-theme-font.sh
          bash crates/keytao-macos-ime/test-chord-key-policy.sh
      - name: Test iOS keyboard policies and interaction
        run: |
          bash crates/keytao-ios-ime/test-interaction-policy.sh
          bash crates/keytao-ios-ime/test-floating-layout.sh
          bash crates/keytao-ios-ime/test-touch-rollover.sh
          bash crates/keytao-ios-ime/test-deployment-state.sh
