name: IME regressions

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/ime-regressions.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native IME test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev cmake pkg-config gdb \
            librime-dev librime-plugin-lua libfreetype6-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev
      - name: Read Rust toolchain pin
        id: rust
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-ime-regressions
      - name: Test shared runtime, FFI and Linux backends
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --locked -p keytao-core -p keytao-core-ffi -p keytao-linux-ime -- --test-threads=1 --nocapture > ime-regressions.log 2>&1
          result=$?
          cat ime-regressions.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          log = Path('ime-regressions.log')
          original = log.read_text(errors='replace')
          if 'Rust cannot catch foreign exceptions' in original:
              with log.open('a') as output:
                  subprocess.run(['pkg-config', '--modversion', 'rime'], stdout=output, stderr=subprocess.STDOUT)
                  subprocess.run(['dpkg-query', '-W', 'librime*'], stdout=output, stderr=subprocess.STDOUT)
                  binary = re.search(r'target/debug/deps/candidate_api-[0-9a-f]+', original)
                  if binary:
                      Path('ime-regression.gdb').write_text('set pagination off\nset print thread-events off\ncatch throw\ncommands\nsilent\nprintf "C++ exception\\n"\nbt 12\ncontinue\nend\nrun\nthread apply all bt 20\n')
                      try:
                          subprocess.run(['gdb', '-q', '-batch', '-x', 'ime-regression.gdb', '--args', binary[0], '--test-threads=1', '--nocapture'], stdout=output, stderr=subprocess.STDOUT, timeout=180)
                      except subprocess.TimeoutExpired:
                          output.write('\nNative crash diagnostic timed out.\n')
          detail = Path('ime-regressions.log').read_text(errors='replace')[-12000:]
          # GitHub truncates each annotation at 4096 characters. Emit the end
          # of the log first, in small blocks, so the actual error stays visible.
          for index, end in enumerate(range(len(detail), 0, -2500), 1):
              block = detail[max(0, end - 2500):end]
              block = block.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native IME failure detail {index}::{block}')
          PY
          fi
          exit "$result"

  apple-policy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck iOS keyboard with device SDK
        run: bash crates/keytao-ios-ime/check-swift-sdk.sh
      - name: Test macOS input context lifetime
        run: bash crates/keytao-macos-ime/test-input-context.sh
      - name: Test iOS keyboard policies and interaction
        run: |
          bash crates/keytao-ios-ime/test-interaction-policy.sh
          bash crates/keytao-ios-ime/test-floating-layout.sh
          bash crates/keytao-ios-ime/test-touch-rollover.sh
