name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (empty = workspace.package.version)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      rust-toolchain: ${{ steps.metadata.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and Rust toolchain
        id: metadata
        uses: actions/github-script@v7
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        with:
          script: |
            const fs = require('node:fs')
            const cargo = fs.readFileSync('Cargo.toml', 'utf8')
            const workspaceVersion = cargo.match(/^\[workspace\.package\]\s*\n(?:(?!^\[)[\s\S])*?^version\s*=\s*"([^"]+)"/m)?.[1]
            const version = context.eventName === 'workflow_dispatch'
              ? process.env.REQUESTED_VERSION.trim() || workspaceVersion
              : context.ref.replace(/^refs\/tags\/v/, '')
            if (!version || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error('Expected a version such as 1.2.1-alpha.89 (without v)')
            }
            const rust = fs.readFileSync('rust-toolchain.toml', 'utf8').match(/^channel\s*=\s*"([^"]+)"/m)?.[1]
            if (!rust) throw new Error('Missing Rust toolchain pin')
            core.setOutput('version', version)
            core.setOutput('rust-toolchain', rust)

  # Repackage the already-published deb pinned in flake.nix, only during pre-runs.
  build-nix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build official release package
        run: nix build .#packages.x86_64-linux.default --print-build-logs
      - name: Check flake
        run: nix flake check --no-build

  build-desktop:
    needs: prepare
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RUSTUP_TOOLCHAIN: ${{ needs.prepare.outputs.rust-toolchain }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_name: linux
            package_arch: x64
            artifacts: |
              dist/keytao-app-${{ needs.prepare.outputs.version }}-linux-x64.deb
              dist/keytao-app-${{ needs.prepare.outputs.version }}-linux-x64.rpm
          - platform: ubuntu-24.04-arm
            os_name: linux
            package_arch: arm64
            artifacts: |
              dist/keytao-app-${{ needs.prepare.outputs.version }}-linux-arm64.deb
              dist/keytao-app-${{ needs.prepare.outputs.version }}-linux-arm64.rpm
          - platform: macos-15
            os_name: macos
            package_arch: universal
            artifacts: target/keytao-macos-pkg/keytao-app-${{ needs.prepare.outputs.version }}-macos.pkg
          - platform: windows-latest
            os_name: windows
            package_arch: x64
            artifacts: target/release/bundle/nsis/keytao-app-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Linux installs the same Flutter pin inside Dockerfile.linux-builder.
      - uses: subosito/flutter-action@v2
        if: matrix.os_name != 'linux'
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.rust-toolchain }}
          targets: ${{ matrix.os_name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.os_name == 'windows' && 'x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc' || '' }}

      - uses: Swatinem/rust-cache@v2
        if: matrix.os_name != 'linux'
        with:
          key: ${{ matrix.os_name }}-${{ matrix.package_arch }}

      - name: Install Windows system deps
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install 7zip llvm nsis -y --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Windows dependency installation failed" }
          $llvmBin = "C:\Program Files\LLVM\bin"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          $hasArm64 = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          $hasArm64Ec = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64EC -property installationPath
          if (-not $hasArm64 -or -not $hasArm64Ec) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $arguments = @(
              "modify",
              "--installPath", $vsInstall,
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64EC",
              "--quiet", "--norestart", "--wait"
            )
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio ARM64/ARM64EC component installation failed with exit code $($process.ExitCode)"
            }
          }

      - name: Set build version
        shell: bash
        run: |
          node scripts/sync-version.mjs --set "$VERSION"
          # Keep --locked builds valid when the requested version differs.
          cargo update --workspace

      - name: Build Linux packages
        if: matrix.os_name == 'linux'
        shell: bash
        run: scripts/build-linux.sh

      - name: Verify Linux bundles
        if: matrix.os_name == 'linux'
        shell: bash
        run: scripts/verify-linux-bundles.sh target/release/bundle "$VERSION"

      - name: Test Windows installer process checks
        if: matrix.os_name == 'windows'
        shell: powershell
        run: |
          ./packaging/windows/tests/check_running_processes_test.ps1
          ./packaging/windows/tests/running_processes_gate_test.ps1 -MakeNsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          ./packaging/windows/tests/replace_payload_test.ps1 -MakeNsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"

      # The entrypoint runs verify-windows-bundle.ps1 with the MSVC environment.
      - name: Build and verify Windows installer
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: ./scripts/build-windows-flutter.ps1 -Arch x64

      - name: Build macOS universal pkg
        if: matrix.os_name == 'macos'
        shell: bash
        run: scripts/build-macos.sh

      - name: Verify macOS universal pkg
        if: matrix.os_name == 'macos'
        shell: bash
        run: scripts/verify-macos-pkg.sh "target/keytao-macos-pkg/keytao-app-${VERSION}-macos.pkg"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}-${{ matrix.package_arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RUSTUP_TOOLCHAIN: ${{ needs.prepare.outputs.rust-toolchain }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEYTAO_ANDROID_LIBRIME_HEADERS_VERSION: '1.17.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.rust-toolchain }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set build version
        run: |
          node scripts/sync-version.mjs --set "$VERSION"
          cargo update --workspace

      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEY_BASE64:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "::error::ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are required for release APK signing"
            exit 1
          fi
          cd flutter_app/android
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore_orig.jks"
          keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/keystore_orig.jks" \
            -destkeystore "$RUNNER_TEMP/keystore.jks" \
            -deststoretype JKS \
            -srcstorepass "$ANDROID_KEY_PASSWORD" \
            -deststorepass "$ANDROID_KEY_PASSWORD" \
            -noprompt
          echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
          echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Import and verify Android librime runtime
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86_64; do
            scripts/android-librime-runtime.sh import-fcitx5-rime --abi "$abi"
            scripts/android-librime-runtime.sh verify --abi "$abi"
          done

      - name: Build Android APKs
        working-directory: flutter_app
        run: |
          unset BZIP2_LIB_DIR BZIP2_INCLUDE_DIR
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Verify and name Android APKs
        run: |
          set -euo pipefail
          mkdir -p dist/release-upload
          for pair in armeabi-v7a:arm arm64-v8a:arm64 x86_64:x86_64; do
            abi="${pair%%:*}"
            arch="${pair#*:}"
            apk="flutter_app/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            cp "$apk" "dist/release-upload/keytao-app-${VERSION}-android-${arch}-release.apk"
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/release-upload/keytao-app-${{ needs.prepare.outputs.version }}-android-arm-release.apk
            dist/release-upload/keytao-app-${{ needs.prepare.outputs.version }}-android-arm64-release.apk
            dist/release-upload/keytao-app-${{ needs.prepare.outputs.version }}-android-x86_64-release.apk
          if-no-files-found: error

  build-ios:
    needs: prepare
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RUSTUP_TOOLCHAIN: ${{ needs.prepare.outputs.rust-toolchain }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.rust-toolchain }}
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Set build version
        run: |
          node scripts/sync-version.mjs --set "$VERSION"
          cargo update --workspace

      - name: Build and import iOS librime runtime
        run: scripts/build-ios-librime.sh --target aarch64-apple-ios

      - name: Build and verify unsigned iOS IPA
        run: scripts/build-flutter-ios.sh

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: flutter_app/build/ios/ipa/keytao-app-${{ needs.prepare.outputs.version }}-ios-arm64-unsigned.ipa
          if-no-files-found: error

  create-release:
    needs: [prepare, build-desktop, build-android, build-ios]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/release-upload
          merge-multiple: true

      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: tag.includes('alpha'),
            })
            return data.id

      - name: Upload all assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/release-upload/* --clobber
