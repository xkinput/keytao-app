[package]
name = "keytao-setup-helper"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Native Windows installer preflight for KeyTao-owned processes"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }
