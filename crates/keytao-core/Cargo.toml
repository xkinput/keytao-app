[package]
name = "keytao-core"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic librime engine wrapper for KeyTao IME"

[dependencies]
serde = { workspace = true }
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.10"
dirs = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

# The Rust librime API is linked by native platform IME frontends.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos", target_os = "android", target_os = "ios"))'.dependencies]
libloading = "0.8"
librime-sys = "0.4.0"
rime-api = { version = "0.12.2", features = ["serde"] }
