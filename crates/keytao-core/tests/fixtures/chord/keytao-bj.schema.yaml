# Chord settings copied from the user's keytao-bj.schema.yaml via the scratch copy.
# Optional Lua/OpenCC/reverse-lookup dependencies are omitted; the dictionary is minimal.
schema:
  schema_id: keytao-bj
  name: KeyTao BJ Chord Regression
  version: "1"

switches:
  - name: ascii_mode
    reset: 0
    states: [ Chinese, English ]

engine:
  processors:
    - ascii_composer
    - chord_composer
    - recognizer
    - key_binder
    - selector
    - speller
    - punctuator
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator

speller:
  auto_select: true
  alphabet: "zyxwvutsrqponmlkjihgfedcba;"
  initials: "abcdefghijklmnopqrstuvwxyz;"

chord_composer:
  alphabet: "qwertasdfgzxcvbyuiophjklnm;',./"
  algebra:
    - xform/^er(?![左右])/i左/
    - xform/^df(?![左右])/y左/
    - xform/^cv(?![左右])/j左/
    - xform/^wr(?![左右])/p左/
    - xform/^sf(?![左右])/k左/
    - xform/^xv(?![左右])/o左/
    - xform/^we(?![左右])/m左/
    - xform/^sd(?![左右])/l左/
    - xform/^xc(?![左右])/h左/
    - xform/^ef(?![左右])/u左/
    - xform/^dv(?![左右])/n左/
    - xform/jk(?![左右])$/a右/
    - xform/kl(?![左右])$/b右/
    - xform/lm(?![左右])$/c右/
    - xform/uo(?![左右])$/d右/
    - xform/jl(?![左右])$/q右/
    - xform/m\.(?![左右])$/t右/
    - xform/ui(?![左右])$/r右/
    - xform/io(?![左右])$/f右/
    - xform/m\,(?![左右])$/g右/
    - xform/\,\.(?![左右])$/v右/
    - xform/ij(?![左右])$/e右/
    - xform/oj(?![左右])$/z右/
    - xform/km(?![左右])$/s右/
    - xform/il(?![左右])$/x右/
    - xform/k\.(?![左右])$/w右/
  output_format:
    - "xform/^(.*)左/$1/"
    - "xform/^(.*)右$/$1/"
    - "xform/^(.*)左(.*)右$/$1$2/"
  prompt_format:
    - "xform/^(.*)$/[$1]/"

translator:
  dictionary: keytao-bj
  prism: keytao-bj
  enable_completion: true
  enable_encoder: true
  enable_sentence: false
  enable_user_dict: false

menu:
  page_size: 5
