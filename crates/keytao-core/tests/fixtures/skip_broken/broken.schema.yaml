schema:
  schema_id: keytao_broken
  name: Broken punctuator schema
  version: '1'
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, fallback_segmentor]
  translators: [table_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
translator:
  dictionary: keytao_smoke
  enable_sentence: false
  enable_user_dict: false
punctuator:
  import_preset: symbols
  half_shape:
    '/': { commit: / }
