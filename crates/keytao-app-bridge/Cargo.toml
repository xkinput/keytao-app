[package]
name = "keytao_app_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
keytao-app-core = { path = "../keytao-app-core" }
keytao-core = { path = "../keytao-core" }
tokio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
