# KeyTao IME default theme.
# Copy this file to the platform user data directory as theme.yaml and edit it
# to override the bundled style.
#
# This document only describes the shared candidate panel and mode hint style.
# The mobile soft keyboard layout lives in keyboard.yaml (see
# default-keyboard.yaml).

version: 2

ui:
  colorScheme: auto

font:
  family: ""
  size: 20
  labelSize: 15
  commentSize: 16
  preeditSize: 15
  weight: semibold

panel:
  orientation: vertical
  background: "#F8FAFFF2"
  borderColor: "#B8C3D0"
  borderWidth: 1
  cornerRadius: 16
  paddingX: 10
  paddingY: 10
  gap: 4
  minWidth: 128
  maxWidth: 320
  maxHeight: 460
  screenMargin: 8
  shadow: true

candidate:
  background: transparent
  hoverBackground: "#F1F6FF"
  pressedBackground: "#D4E7FF"
  pressedForeground: "#14233B"
  selectedBackground: "#E6F0FF"
  foreground: "#263442"
  selectedForeground: "#243241"
  labelColor: "#7F8D9C"
  selectedLabelColor: "#4A8DF6"
  commentColor: "#3F4E5E"
  selectedCommentColor: "#2E3E50"
  borderColor: transparent
  selectedBorderColor: "#5DA7D7"
  borderWidth: 1
  cornerRadius: 11
  paddingX: 10
  paddingY: 5
  inlineGap: 4
  minHeight: 34
  maxWidth: 190
  separatorVisible: false
  separatorColor: "#DCE7F7"
  labelSuffix: "."

navigation:
  foreground: "#687684"
  disabledForeground: "#A5B0B8"
  hoverBackground: "#F1F6FF"
  buttonSize: 28
  cornerRadius: 10

modeHint:
  background: "#2D4B63"
  foreground: "#FFFFFF"
  borderColor: "#5DA7D7"
  borderWidth: 1
  fontSize: 24
  width: 72
  height: 44
  cornerRadius: 14
  duration: 0.75
  shadow: true
  chineseText: "中"
  englishText: "英"

dark:
  panel:
    background: "#171A20F2"
    borderColor: "#3E4652"
    shadow: true

  candidate:
    hoverBackground: "#222A33"
    pressedBackground: "#385873"
    pressedForeground: "#FFFFFF"
    selectedBackground: "#2D4B63"
    foreground: "#EEF3F7"
    selectedForeground: "#FFFFFF"
    labelColor: "#9AA8B5"
    selectedLabelColor: "#B6E3FF"
    commentColor: "#C9D3DC"
    selectedCommentColor: "#E9F2FA"
    borderColor: transparent
    selectedBorderColor: "#5DA7D7"
    separatorColor: "#343C47"

  navigation:
    foreground: "#C8D2DA"
    disabledForeground: "#66717C"
    hoverBackground: "#242D36"

  modeHint:
    background: "#2D4B63"
    foreground: "#FFFFFF"
    borderColor: "#5DA7D7"
    borderWidth: 1
