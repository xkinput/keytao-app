# KeyTao IME default keyboard layout.
# Copy this file to the platform Rime data directory as keyboard.yaml and edit it
# to customize mobile keyboard pages, keys, commands, long press, swipe actions,
# and keyboardMode jumps.

version: 1

height: 266
candidateBarHeight: 52
bottomInset: 0
horizontalGap: 4
verticalGap: 5
outerInset: 5
maxKeyHeight: 54

# Floating mode stays inside the system IME window. Scale is relative to the
# full keyboard and can be overridden independently for each orientation.
# Portrait accepts 0.70-1.00; landscape accepts 0.45-1.00.
floating:
  margin: 8
  portrait:
    enabled: false
    scale: 0.88
  landscape:
    enabled: true
    scale: 0.62

rows:
  - [
      { label: "q", hint: "1", value: "q", longPress: { type: input, value: "1" }, alternates: [ { label: "1", value: "1" }, { label: "!", value: "!" } ] },
      { label: "w", hint: "2", value: "w", longPress: { type: input, value: "2" }, alternates: [ { label: "2", value: "2" }, { label: "@", value: "@" } ] },
      { label: "e", hint: "3", value: "e", longPress: { type: input, value: "3" }, alternates: [ { label: "3", value: "3" }, { label: "#", value: "#" } ], asciiAlternates: [ { label: "3", value: "3" }, { label: "#", value: "#" }, { label: "é", value: "é" }, { label: "è", value: "è" }, { label: "ê", value: "ê" }, { label: "ë", value: "ë" } ] },
      { label: "r", hint: "4", value: "r", longPress: { type: input, value: "4" }, alternates: [ { label: "4", value: "4" }, { label: "$", value: "$" } ] },
      { label: "t", hint: "5", value: "t", longPress: { type: input, value: "5" }, alternates: [ { label: "5", value: "5" }, { label: "%", value: "%" } ] },
      { label: "y", hint: "6", value: "y", longPress: { type: input, value: "6" }, alternates: [ { label: "6", value: "6" }, { label: "^", value: "^" } ] },
      { label: "u", hint: "7", value: "u", longPress: { type: input, value: "7" }, alternates: [ { label: "7", value: "7" }, { label: "&", value: "&" } ], asciiAlternates: [ { label: "7", value: "7" }, { label: "&", value: "&" }, { label: "ú", value: "ú" }, { label: "ù", value: "ù" }, { label: "û", value: "û" }, { label: "ü", value: "ü" } ] },
      { label: "i", hint: "8", value: "i", longPress: { type: input, value: "8" }, alternates: [ { label: "8", value: "8" }, { label: "*", value: "*" } ], asciiAlternates: [ { label: "8", value: "8" }, { label: "*", value: "*" }, { label: "í", value: "í" }, { label: "ì", value: "ì" }, { label: "î", value: "î" }, { label: "ï", value: "ï" } ] },
      { label: "o", hint: "9", value: "o", longPress: { type: input, value: "9" }, alternates: [ { label: "9", value: "9" }, { label: "(", value: "(" } ], asciiAlternates: [ { label: "9", value: "9" }, { label: "(", value: "(" }, { label: "ó", value: "ó" }, { label: "ò", value: "ò" }, { label: "ô", value: "ô" }, { label: "ö", value: "ö" } ] },
      { label: "p", hint: "0", value: "p", longPress: { type: input, value: "0" }, alternates: [ { label: "0", value: "0" }, { label: ")", value: ")" } ] }
    ]
  - [
      { label: "a", hint: "@", value: "a", longPress: { type: input, value: "@" }, asciiAlternates: [ { label: "@", value: "@" }, { label: "á", value: "á" }, { label: "à", value: "à" }, { label: "â", value: "â" }, { label: "ä", value: "ä" }, { label: "ã", value: "ã" }, { label: "å", value: "å" } ] },
      { label: "s", hint: "#", value: "s", longPress: { type: input, value: "#" } },
      { label: "d", hint: "$", value: "d", longPress: { type: input, value: "$" } },
      { label: "f", hint: "%", value: "f", longPress: { type: input, value: "%" } },
      { label: "g", hint: "&", value: "g", longPress: { type: input, value: "&" } },
      { label: "h", hint: "*", value: "h", longPress: { type: input, value: "*" } },
      { label: "j", hint: "(", value: "j", longPress: { type: input, value: "(" } },
      { label: "k", hint: ")", value: "k", longPress: { type: input, value: ")" } },
      { label: "l", hint: "_", value: "l", longPress: { type: input, value: "_" } }
    ]
  - [
      { label: "⇧", weight: 1.3, action: { type: shift } },
      { label: "z", hint: "-", value: "z", longPress: { type: input, value: "-" } },
      { label: "x", hint: "/", value: "x", longPress: { type: input, value: "/" } },
      { label: "c", hint: ":", value: "c", longPress: { type: input, value: ":" }, asciiAlternates: [ { label: ":", value: ":" }, { label: "ç", value: "ç" } ] },
      { label: "v", hint: ";", value: "v", longPress: { type: input, value: ";" } },
      { label: "b", hint: "\"", value: "b", longPress: { type: input, value: "\"" } },
      { label: "n", hint: "'", value: "n", longPress: { type: input, value: "'" }, asciiAlternates: [ { label: "'", value: "'" }, { label: "ñ", value: "ñ" } ] },
      { label: "m", hint: "=", value: "m", longPress: { type: input, value: "=" } },
      { label: "⌫", weight: 1.3, action: { type: backspace } }
    ]
  - [
      { label: "123", weight: 1.15, action: { type: keyboardMode, value: numbers }, longPress: { type: nextInputMethod } },
      { label: "，", value: "，", asciiLabel: ",", asciiValue: ",", hint: "!", longPress: { type: directInput, value: "！" }, asciiLongPress: { type: directInput, value: "!" }, alternates: [ { label: "！", action: { type: directInput, value: "！" } }, { label: "？", action: { type: directInput, value: "？" } }, { label: "；", action: { type: directInput, value: "；" } }, { label: "：", action: { type: directInput, value: "：" } }, { label: "⚙", action: { type: openPage, value: settings } }, { label: "布局", action: { type: floating } }, { label: "#+=", action: { type: keyboardMode, value: symbols } } ], asciiAlternates: [ { label: "!", action: { type: directInput, value: "!" } }, { label: "?", action: { type: directInput, value: "?" } }, { label: ";", action: { type: directInput, value: ";" } }, { label: ":", action: { type: directInput, value: ":" } }, { label: "⚙", action: { type: openPage, value: settings } }, { label: "布局", action: { type: floating } }, { label: "#+=", action: { type: keyboardMode, value: symbols } } ] },
      { label: "空格", weight: 4.6, action: { type: space }, swipeDown: { type: reset } },
      { label: "。", value: "。", asciiLabel: ".", asciiValue: ".", hint: "?", longPress: { type: directInput, value: "？" }, asciiLongPress: { type: directInput, value: "?" }, alternates: [ { label: "…", action: { type: directInput, value: "…" } }, { label: "、", action: { type: directInput, value: "、" } }, { label: "~", action: { type: directInput, value: "~" } } ] },
      { label: "↵", weight: 1.45, action: { type: enter }, alternates: [ { label: "↵", action: { type: enter } }, { label: "悬浮", action: { type: floating } } ] }
    ]

numberRows:
  - [
      { label: "+", value: "+", rowSpan: 3, stack: [
        { label: "+", value: "+" },
        { label: "*", value: "*" },
        { label: "-", value: "-" },
        { label: "/", value: "/" }
      ] },
      { label: "1", hint: "!", value: "1", alternates: [ { label: "!", value: "!" } ] },
      { label: "2", hint: "@", value: "2", alternates: [ { label: "@", value: "@" } ] },
      { label: "3", hint: "#", value: "3", alternates: [ { label: "#", value: "#" } ] },
      { label: "⌫", action: { type: backspace } }
    ]
  - [
      { label: "4", hint: "$", value: "4", alternates: [ { label: "$", value: "$" } ] },
      { label: "5", hint: "%", value: "5", alternates: [ { label: "%", value: "%" } ] },
      { label: "6", hint: "^", value: "6", alternates: [ { label: "^", value: "^" } ] },
      { label: "·", value: "." }
    ]
  - [
      { label: "7", hint: "&", value: "7", alternates: [ { label: "&", value: "&" } ] },
      { label: "8", hint: "*", value: "8", alternates: [ { label: "*", value: "*" } ] },
      { label: "9", hint: "(", value: "9", alternates: [ { label: "(", value: "(" } ] },
      { label: "=", value: "=" }
    ]
  - [
      { label: "返回", action: { type: keyboardMode, value: letters } },
      { label: "#+=", action: { type: keyboardMode, value: symbols } },
      { label: "0", hint: ")", value: "0", alternates: [ { label: ")", value: ")" } ] },
      { label: "␣", action: { type: space } },
      { label: "发送", action: { type: enter }, alternates: [ { label: "发送", action: { type: enter } }, { label: "悬浮", action: { type: floating } } ] }
    ]

symbolRows:
  - &symbolHeader [
      { label: "中文", action: { type: "keyboardMode", value: "symbols" } },
      { label: "英文", action: { type: "keyboardMode", value: "symbols_en" } },
      { label: "数学", action: { type: "keyboardMode", value: "symbols_math" } },
      { label: "符号", action: { type: "keyboardMode", value: "symbols_marks" } },
      { label: "序号", action: { type: "keyboardMode", value: "symbols_numbers" } },
      { label: "拼音", action: { type: "keyboardMode", value: "symbols_pinyin" } },
      { label: "颜文", action: { type: "keyboardMode", value: "symbols_kaomoji" } },
      { label: "Emoji", action: { type: "keyboardMode", value: "symbols_emoji_face" } }
    ]
  - [
      { label: "【", value: "【", asciiLabel: "[", asciiValue: "[", rimeValue: ";k" },
      { label: "】", value: "】", asciiLabel: "]", asciiValue: "]", rimeValue: ";l" },
      { label: "《", value: "《", asciiLabel: "<", asciiValue: "<", rimeValue: ";u" },
      { label: "》", value: "》", asciiLabel: ">", asciiValue: ">", rimeValue: ";i" },
      { label: "「", value: "「", asciiLabel: "{", asciiValue: "{" },
      { label: "」", value: "」", asciiLabel: "}", asciiValue: "}" },
      { label: "、", value: "、", asciiLabel: "\\", asciiValue: "\\", rimeValue: ";d" },
      { label: "：", value: "：", asciiLabel: ":", asciiValue: ":" },
      { label: "；", value: "；", asciiLabel: ";", asciiValue: ";" },
      { label: "？", value: "？", asciiLabel: "?", asciiValue: "?", rimeValue: ";w" }
    ]
  - [
      { label: "！", value: "！", asciiLabel: "!", asciiValue: "!", rimeValue: ";t" },
      { label: "（", value: "（", asciiLabel: "(", asciiValue: "(", rimeValue: ";e" },
      { label: "）", value: "）", asciiLabel: ")", asciiValue: ")", rimeValue: ";r" },
      { label: "￥", value: "￥", asciiLabel: "$", asciiValue: "$" },
      { label: "……", value: "……", asciiLabel: "^", asciiValue: "^", rimeValue: ";s" },
      { label: "—", value: "—", asciiLabel: "_", asciiValue: "_" },
      { label: "·", value: "·", asciiLabel: "`", asciiValue: "`", rimeValue: ";o" },
      { label: "～", value: "～", asciiLabel: "~", asciiValue: "~" },
      { label: "“", value: "“", asciiLabel: "\"", asciiValue: "\"", rimeValue: ";f" },
      { label: "”", value: "”", asciiLabel: "'", asciiValue: "'", rimeValue: ";g" }
    ]
  - [
      { label: "『", value: "『" },
      { label: "』", value: "』" },
      { label: "「", value: "「" },
      { label: "」", value: "」" },
      { label: "〔", value: "〔" },
      { label: "〕", value: "〕" },
      { label: "〈", value: "〈" },
      { label: "〉", value: "〉" },
      { label: "—", value: "—", asciiLabel: "_", asciiValue: "_" },
      { label: "…", value: "…", asciiLabel: "...", asciiValue: "...", rimeValue: ";s" }
    ]
  - [
      { label: "，", value: "，", asciiLabel: ",", asciiValue: "," },
      { label: "。", value: "。", asciiLabel: ".", asciiValue: "." },
      { label: "、", value: "、", asciiLabel: "/", asciiValue: "/", rimeValue: ";d" },
      { label: "：", value: "：" },
      { label: "；", value: "；" },
      { label: "？", value: "？", asciiLabel: "?", asciiValue: "?", rimeValue: ";w" },
      { label: "！", value: "！", asciiLabel: "!", asciiValue: "!", rimeValue: ";t" },
      { label: "·", value: "·", rimeValue: ";o" },
      { label: "～", value: "～" },
      { label: "￥", value: "￥" }
    ]
  - &symbolFooter [
      { label: "123", weight: 1.15, action: { type: "keyboardMode", value: "numbers" }, longPress: { type: "nextInputMethod" } },
      { label: "ABC", weight: 1.15, action: { type: "keyboardMode", value: "letters" } },
      { label: "空格", weight: 4.6, action: { type: "space" } },
      { label: "⌫", weight: 1.15, action: { type: "backspace" } },
      { label: "↵", weight: 1.15, action: { type: "enter" }, alternates: [ { label: "↵", action: { type: "enter" } }, { label: "悬浮", action: { type: "floating" } } ] }
    ]

