version: 2

meta:
  id: "keytao.keydo30"
  name: "键道·我流"
  author: "KeyTao"
  description: "Colemak-DH 30 键布局，内置我流音形助记（默认关闭，可在设置开启）"
  recommendedSchemas:
    - "keydo"

inheritsDefaultLayers: true
numberRow: auto

keyGroups:
  outer:
    light: { borderColor: "#F29D6B" }
    dark:  { borderColor: "#D9824F" }
  stroke:
    light: { borderColor: "#B388EB", foreground: "#7A52C7" }
    dark:  { borderColor: "#C5A3F7", foreground: "#D6BCFA" }
  guide:
    light: { borderColor: "#6BA3FF" }
    dark:  { borderColor: "#6BA3FF" }

rows:
  - [
      { label: "q", hint: "1", value: "q", swipeUp: { type: input, value: "1" }, longPress: { type: input, value: "1" }, mnemonic: { top: "zh", bottomLines: ["iu ua"], tone: outer, group: outer } },
      { label: "w", hint: "2", value: "w", swipeUp: { type: input, value: "2" }, longPress: { type: input, value: "2" }, mnemonic: { top: "ch", bottomLines: ["ei un"], tone: outer, group: outer } },
      { label: "f", hint: "3", value: "f", swipeUp: { type: input, value: "3" }, longPress: { type: input, value: "3" }, mnemonic: { top: "zh", bottomLines: ["an"], tone: outer, group: outer } },
      { label: "p", hint: "4", value: "p", swipeUp: { type: input, value: "4" }, longPress: { type: input, value: "4" }, mnemonic: { bottomLines: ["ang"], tone: outer, group: outer } },
      { label: "b", hint: "5", value: "b", swipeUp: { type: input, value: "5" }, longPress: { type: input, value: "5" }, mnemonic: { bottomLines: ["in ui"], tone: outer, group: outer } },
      { label: "j", hint: "6", value: "j", swipeUp: { type: input, value: "6" }, longPress: { type: input, value: "6" }, mnemonic: { top: "ch", bottomLines: ["er u"], tone: outer, group: outer } },
      { label: "l", hint: "7", value: "l", swipeUp: { type: input, value: "7" }, longPress: { type: input, value: "7" }, mnemonic: { bottomLines: ["o uo ü"], tone: outer, group: outer } },
      { label: "u", hint: "8", value: "u", swipeUp: { type: input, value: "8" }, longPress: { type: input, value: "8" }, mnemonic: { top: "丿", topBadge: "月", bottomLines: ["o十"], tone: special, group: stroke } },
      { label: "y", hint: "9", value: "y", swipeUp: { type: input, value: "9" }, longPress: { type: input, value: "9" }, mnemonic: { bottomLines: ["iong ong"], tone: outer, group: outer } },
      { label: ";", hint: "0", value: ";", asciiLabel: ";", asciiValue: ";", swipeUp: { type: input, value: "0" }, longPress: { type: input, value: "0" }, mnemonic: { bottomLines: ["引导"], tone: guide, group: guide } }
    ]
  - [
      { label: "a", hint: "☑", value: "a", swipeUp: { type: edit, value: selectAll }, longPress: { type: edit, value: selectAll }, mnemonic: { top: "㇕", topBadge: "氵", bottomLines: ["o贝"], tone: special, group: stroke } },
      { label: "r", hint: "|←", value: "r", swipeUp: { type: edit, value: lineStart }, longPress: { type: edit, value: lineStart }, mnemonic: { bottomLines: ["eng"], tone: outer, group: outer } },
      { label: "s", hint: "→|", value: "s", swipeUp: { type: edit, value: lineEnd }, longPress: { type: edit, value: lineEnd }, mnemonic: { bottomLines: ["a ia"], tone: outer, group: outer } },
      { label: "t", hint: "?", value: "t", swipeUp: { type: input, value: "?" }, longPress: { type: input, value: "?" }, mnemonic: { bottomLines: ["uan"], tone: outer, group: outer } },
      { label: "g", hint: "反", value: "g", swipeUp: { type: input, value: "`" }, longPress: { type: input, value: "`" }, mnemonic: { bottomLines: ["ing uai"], tone: outer, group: outer } },
      { label: "m", hint: "⇥", value: "m", swipeUp: { type: edit, value: cursorRight }, longPress: { type: edit, value: cursorRight }, mnemonic: { bottomLines: ["ian uang"], tone: outer, group: outer } },
      { label: "n", hint: "✓", value: "n", swipeUp: { type: edit, value: toggleSelection }, longPress: { type: edit, value: toggleSelection }, mnemonic: { bottomLines: ["en"], tone: outer, group: outer } },
      { label: "e", hint: "[", value: "e", swipeUp: { type: input, value: "[" }, longPress: { type: input, value: "[" }, mnemonic: { top: "sh", bottomLines: ["e"], tone: outer, group: outer } },
      { label: "i", hint: "]", value: "i", swipeUp: { type: input, value: "]" }, longPress: { type: input, value: "]" }, mnemonic: { top: "丨", topBadge: "亻", bottomLines: ["i艹 o钅", "u扌"], tone: special, group: stroke } },
      { label: "o", hint: ":", value: "o", swipeUp: { type: input, value: ":" }, longPress: { type: input, value: ":" }, mnemonic: { top: "丶", topBadge: "口", bottomLines: ["i日"], tone: special, group: stroke } }
    ]
  - [
      { label: "⇧", hint: "TAB", weight: 1.3, action: { type: shift }, swipeUp: { type: edit, value: tab }, longPress: { type: edit, value: tab } },
      { label: "z", hint: "`", value: "z", swipeUp: { type: input, value: "`" }, longPress: { type: input, value: "`" }, mnemonic: { bottomLines: ["ao"], tone: outer, group: outer } },
      { label: "x", hint: "✂", value: "x", swipeUp: { type: edit, value: cut }, longPress: { type: edit, value: cut }, mnemonic: { top: "∅", bottomLines: ["iang uang"], tone: outer, group: outer } },
      { label: "c", hint: "❐", value: "c", swipeUp: { type: edit, value: copy }, longPress: { type: edit, value: copy }, mnemonic: { bottomLines: ["iao"], tone: outer, group: outer } },
      { label: "d", hint: "▣", value: "d", swipeUp: { type: edit, value: paste }, longPress: { type: edit, value: paste }, mnemonic: { bottomLines: ["ie ou"], tone: outer, group: outer } },
      { label: "v", hint: "~", value: "v", swipeUp: { type: input, value: "~" }, longPress: { type: input, value: "~" }, mnemonic: { top: "一", topBadge: "木", bottomLines: ["o土"], tone: special, group: stroke } },
      { label: "k", hint: "\"", value: "k", swipeUp: { type: input, value: "\"" }, longPress: { type: input, value: "\"" }, mnemonic: { bottomLines: ["i"], tone: outer, group: outer } },
      { label: "h", hint: "'", value: "h", swipeUp: { type: input, value: "'" }, longPress: { type: input, value: "'" }, mnemonic: { bottomLines: ["ai üe"], tone: outer, group: outer } },
      { label: "⌫", hint: "行", weight: 1.3, action: { type: backspace }, swipeUp: { type: edit, value: clearAll }, longPress: { type: edit, value: clearAll } }
    ]
  - [
      { label: "数", hint: "符", weight: 1.35, action: { type: keyboardMode, value: numbers }, swipeUp: { type: keyboardMode, value: "symbols:last" }, longPress: { type: keyboardMode, value: "symbols:last" }, alternates: [ { label: "符号", action: { type: keyboardMode, value: "symbols:last" } }, { label: "123", action: { type: keyboardMode, value: numbers } }, { label: "切换输入法", action: { type: nextInputMethod } } ] },
      { label: "/", hint: "\\", value: "/", asciiLabel: "/", asciiValue: "/", weight: 1.0, swipeUp: { type: input, value: "\\" }, longPress: { type: input, value: "\\" }, mnemonic: { bottomLines: ["重复"], tone: guide, group: guide } },
      { label: "空格", weight: 3.65, action: { type: space }, swipeDown: { type: reset } },
      { label: ",", hint: "<", value: ",", asciiLabel: ",", asciiValue: ",", weight: 1.0, swipeUp: { type: input, value: "<" }, longPress: { type: input, value: "<" }, mnemonic: { tone: guide, group: guide } },
      { label: ".", hint: ">", value: ".", asciiLabel: ".", asciiValue: ".", weight: 1.0, swipeUp: { type: input, value: ">" }, longPress: { type: input, value: ">" }, mnemonic: { tone: guide, group: guide } },
      { label: "↵", hint: "☆", weight: 1.6, action: { type: enter }, swipeUp: { type: keyboardMode, value: "emoji:last" }, alternates: [ { label: "↵", action: { type: enter } }, { label: "表情", action: { type: keyboardMode, value: "emoji:last" } }, { label: "悬浮", action: { type: floating } } ] }
    ]
