version: 2

meta:
  id: "keytao.keytao26"
  name: "键道6 助记键盘"
  author: "KeyTao"
  description: "标准 26 键排布，内置键道6 音形助记（默认关闭，可在设置开启）"

inheritsDefaultLayers: true
numberRow: auto

keyGroups:
  stroke:
    light: { borderColor: "#9D7AD9", foreground: "#6F42C1" }
    dark:  { borderColor: "#B794F4", foreground: "#D6BCFA" }

rows:
  - [
      { label: "q", hint: "1", value: "q", longPress: { type: input, value: "1" }, alternates: [ { label: "1", value: "1" }, { label: "!", value: "!" } ], mnemonic: { top: "zh", bottomLines: ["iu ua"], tone: outer } },
      { label: "w", hint: "2", value: "w", longPress: { type: input, value: "2" }, alternates: [ { label: "2", value: "2" }, { label: "@", value: "@" } ], mnemonic: { top: "ch", bottomLines: ["ei un"], tone: outer } },
      { label: "e", hint: "3", value: "e", longPress: { type: input, value: "3" }, alternates: [ { label: "3", value: "3" }, { label: "#", value: "#" } ], asciiAlternates: [ { label: "3", value: "3" }, { label: "#", value: "#" }, { label: "é", value: "é" }, { label: "è", value: "è" }, { label: "ê", value: "ê" }, { label: "ë", value: "ë" } ], mnemonic: { top: "sh", bottomLines: ["e"], tone: outer } },
      { label: "r", hint: "4", value: "r", longPress: { type: input, value: "4" }, alternates: [ { label: "4", value: "4" }, { label: "$", value: "$" } ], mnemonic: { bottomLines: ["eng"], tone: outer } },
      { label: "t", hint: "5", value: "t", longPress: { type: input, value: "5" }, alternates: [ { label: "5", value: "5" }, { label: "%", value: "%" } ], mnemonic: { bottomLines: ["uan"], tone: outer } },
      { label: "y", hint: "6", value: "y", longPress: { type: input, value: "6" }, alternates: [ { label: "6", value: "6" }, { label: "^", value: "^" } ], mnemonic: { bottomLines: ["iong ong"], tone: outer } },
      { label: "u", hint: "7", value: "u", longPress: { type: input, value: "7" }, alternates: [ { label: "7", value: "7" }, { label: "&", value: "&" } ], asciiAlternates: [ { label: "7", value: "7" }, { label: "&", value: "&" }, { label: "ú", value: "ú" }, { label: "ù", value: "ù" }, { label: "û", value: "û" }, { label: "ü", value: "ü" } ], mnemonic: { top: "丿", bottomLines: ["月 十o"], tone: special, group: stroke } },
      { label: "i", hint: "8", value: "i", longPress: { type: input, value: "8" }, alternates: [ { label: "8", value: "8" }, { label: "*", value: "*" } ], asciiAlternates: [ { label: "8", value: "8" }, { label: "*", value: "*" }, { label: "í", value: "í" }, { label: "ì", value: "ì" }, { label: "î", value: "î" }, { label: "ï", value: "ï" } ], mnemonic: { top: "丨", bottomLines: ["人 手u", "草i 金o"], tone: special, group: stroke } },
      { label: "o", hint: "9", value: "o", longPress: { type: input, value: "9" }, alternates: [ { label: "9", value: "9" }, { label: "(", value: "(" } ], asciiAlternates: [ { label: "9", value: "9" }, { label: "(", value: "(" }, { label: "ó", value: "ó" }, { label: "ò", value: "ò" }, { label: "ô", value: "ô" }, { label: "ö", value: "ö" } ], mnemonic: { top: "丶", bottomLines: ["口 日i"], tone: special, group: stroke } },
      { label: "p", hint: "0", value: "p", longPress: { type: input, value: "0" }, alternates: [ { label: "0", value: "0" }, { label: ")", value: ")" } ], mnemonic: { bottomLines: ["ang"], tone: outer } }
    ]
  - [
      { label: "a", hint: "@", value: "a", longPress: { type: input, value: "@" }, asciiAlternates: [ { label: "@", value: "@" }, { label: "á", value: "á" }, { label: "à", value: "à" }, { label: "â", value: "â" }, { label: "ä", value: "ä" }, { label: "ã", value: "ã" }, { label: "å", value: "å" } ], mnemonic: { top: "㇕", bottomLines: ["水 贝o"], tone: special, group: stroke } },
      { label: "s", hint: "#", value: "s", longPress: { type: input, value: "#" }, mnemonic: { bottomLines: ["a ia"], tone: outer } },
      { label: "d", hint: "$", value: "d", longPress: { type: input, value: "$" }, mnemonic: { bottomLines: ["ie ou"], tone: outer } },
      { label: "f", hint: "%", value: "f", longPress: { type: input, value: "%" }, mnemonic: { top: "zh", bottomLines: ["an"], tone: outer } },
      { label: "g", hint: "&", value: "g", longPress: { type: input, value: "&" }, mnemonic: { bottomLines: ["ing uai"], tone: outer } },
      { label: "h", hint: "*", value: "h", longPress: { type: input, value: "*" }, mnemonic: { bottomLines: ["ai üe"], tone: outer } },
      { label: "j", hint: "(", value: "j", longPress: { type: input, value: "(" }, mnemonic: { top: "ch", bottomLines: ["er u"], tone: outer } },
      { label: "k", hint: ")", value: "k", longPress: { type: input, value: ")" }, mnemonic: { bottomLines: ["i"], tone: outer } },
      { label: "l", hint: "_", value: "l", longPress: { type: input, value: "_" }, mnemonic: { bottomLines: ["o uo", "ü"], tone: outer } }
    ]
  - [
      { label: "⇧", weight: 1.3, action: { type: shift } },
      { label: "z", hint: "-", value: "z", longPress: { type: input, value: "-" }, mnemonic: { bottomLines: ["ao"], tone: outer } },
      { label: "x", hint: "/", value: "x", longPress: { type: input, value: "/" }, mnemonic: { top: "~", bottomLines: ["iang uang"], tone: outer } },
      { label: "c", hint: ":", value: "c", longPress: { type: input, value: ":" }, asciiAlternates: [ { label: ":", value: ":" }, { label: "ç", value: "ç" } ], mnemonic: { bottomLines: ["iao"], tone: outer } },
      { label: "v", hint: ";", value: "v", longPress: { type: input, value: ";" }, mnemonic: { top: "一", bottomLines: ["木 土o"], tone: special, group: stroke } },
      { label: "b", hint: "\"", value: "b", longPress: { type: input, value: "\"" }, mnemonic: { bottomLines: ["in ui"], tone: outer } },
      { label: "n", hint: "'", value: "n", longPress: { type: input, value: "'" }, asciiAlternates: [ { label: "'", value: "'" }, { label: "ñ", value: "ñ" } ], mnemonic: { bottomLines: ["en"], tone: outer } },
      { label: "m", hint: "=", value: "m", longPress: { type: input, value: "=" }, mnemonic: { bottomLines: ["ian uang"], tone: outer } },
      { label: "⌫", weight: 1.3, action: { type: backspace } }
    ]
  - [
      { label: "123", weight: 1.15, action: { type: keyboardMode, value: numbers }, longPress: { type: nextInputMethod } },
      { label: "，", value: "，", asciiLabel: ",", asciiValue: ",", hint: "!", longPress: { type: directInput, value: "！" }, asciiLongPress: { type: directInput, value: "!" }, alternates: [ { label: "！", action: { type: directInput, value: "！" } }, { label: "？", action: { type: directInput, value: "？" } }, { label: "；", action: { type: directInput, value: "；" } }, { label: "：", action: { type: directInput, value: "：" } }, { label: "⚙", action: { type: openPage, value: settings } }, { label: "布局", action: { type: floating } }, { label: "#+=", action: { type: keyboardMode, value: "symbols:last" } } ], asciiAlternates: [ { label: "!", action: { type: directInput, value: "!" } }, { label: "?", action: { type: directInput, value: "?" } }, { label: ";", action: { type: directInput, value: ";" } }, { label: ":", action: { type: directInput, value: ":" } }, { label: "⚙", action: { type: openPage, value: settings } }, { label: "布局", action: { type: floating } }, { label: "#+=", action: { type: keyboardMode, value: "symbols:last" } } ] },
      { label: "空格", weight: 4.6, action: { type: space }, swipeDown: { type: reset } },
      { label: "。", value: "。", asciiLabel: ".", asciiValue: ".", hint: "?", longPress: { type: directInput, value: "？" }, asciiLongPress: { type: directInput, value: "?" }, alternates: [ { label: "？", action: { type: directInput, value: "？" } }, { label: "…", action: { type: directInput, value: "…" } }, { label: "、", action: { type: directInput, value: "、" } }, { label: "~", action: { type: directInput, value: "~" } } ], asciiAlternates: [ { label: "?", action: { type: directInput, value: "?" } }, { label: "…", action: { type: directInput, value: "…" } }, { label: "/", action: { type: directInput, value: "/" } }, { label: "~", action: { type: directInput, value: "~" } } ] },
      { label: "↵", weight: 1.45, action: { type: enter }, alternates: [ { label: "↵", action: { type: enter } }, { label: "悬浮", action: { type: floating } } ] }
    ]
