[package]
name = "keytao-theme"
version = "0.1.0"
edition = "2021"
description = "Shared KeyTao IME theme schema, resolver, and UI model adapter"

[dependencies]
dirs = { workspace = true }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1"
ryu-js = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
] }
